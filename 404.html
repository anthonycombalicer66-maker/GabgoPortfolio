<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404 — Anthony Combalicer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d4ed8'/%3E%3Ctext x='32' y='42' font-size='28' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3EAC%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (e) {}
    })();
  </script>
  <style>
    .nf-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }
    .nf-card {
      max-width: 480px;
      padding: 40px 32px;
      box-shadow: var(--card-shadow);
    }
    .nf-code {
      display: inline-block;
      font: 700 0.8rem var(--mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }
    .nf-card h1 {
      font-size: 1.9rem;
      margin: 0 0 10px;
      letter-spacing: -0.025em;
    }
    .nf-card p {
      color: var(--muted);
      margin: 0 0 26px;
    }
    .nf-card .btns {
      justify-content: center;
    }
  </style>
</head>
<body>
  <main class="nf-wrap">
    <div class="nf-card node-frame">
      <span class="nf-code">404 // ROUTE NOT FOUND</span>
      <h1>Nothing at this link.</h1>
      <p>The page you followed may have moved. Head back to my portfolio or open my résumé directly.</p>
      <div class="btns">
        <a class="btn primary" href="/">Back to portfolio</a>
        <a class="btn ghost" href="/resume.html">View résumé</a>
      </div>
    </div>
  </main>
</body>
</html>
